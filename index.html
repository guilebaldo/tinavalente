<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Tina Valente — demostración de boutique de artesanías mexicanas centradas en productores y experiencias en taller."
    />
    <title>Tina Valente — Artesanías de México</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Saltar al contenido</a>
    <div class="demo-banner" role="status">
      <strong>Demo comercial</strong> — Guru Software Studio para Tina Valente. No se realizan cobros ni reservas reales.
    </div>
    <header class="site-header">
      <div class="header-inner">
        <a class="logo" href="#/">Tina <span>Valente</span></a>
        <button
          type="button"
          class="nav-toggle"
          aria-label="Abrir menú"
          aria-expanded="false"
          aria-controls="site-nav"
        >
          <span></span><span></span><span></span>
        </button>
        <nav id="site-nav" class="site-nav" aria-label="Principal">
          <a href="#/">Inicio</a>
          <a href="#/experiencias">Experiencias</a>
          <a href="#/nosotros">Nosotros</a>
          <a class="cart-link" href="#/carrito"
            >Carrito <span class="cart-count" data-cart-count hidden>0</span></a
          >
        </nav>
      </div>
    </header>
    <main id="app" tabindex="-1"></main>
    <footer class="footer">
      <p>
        Tina Valente · Propuesta de demostración · Mapa
        <a href="https://github.com/VictorCazanave/svg-maps" target="_blank" rel="noopener noreferrer"
          >@svg-maps/mexico</a
        >
        (CC BY 4.0)
      </p>
    </footer>
    <script src="/data/catalog.js"></script>
    <script src="/data/mexico-map.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/router.js"></script>
    <script src="/js/map.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
